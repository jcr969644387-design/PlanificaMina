name: Build APK

# Se dispara en cada push a main, al crear una etiqueta de versión
# (v1.0.0, v1.1.0…) o a mano desde la pestaña Actions.
#
# El disparo por push existe para que siempre haya un APK descargable desde
# la pestaña Actions sin tener que etiquetar. Solo las etiquetas publican
# además un release con el instalador adjunto.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK de release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      # Las pruebas corren ANTES de generar el andamio: son de dominio puro, no
      # necesitan plataforma, y así se ejecutan sobre el mismo árbol que valida
      # el workflow CI.
      - name: Pruebas antes de compilar
        run: flutter test

      # El repositorio no versiona las carpetas android/ e ios/ porque son
      # andamios generados. Si no existen, se crean aquí sin tocar lib/.
      #
      # `flutter create` repone todos los archivos del template que falten, y
      # eso incluye test/widget_test.dart: el test del contador, que espera un
      # `MyApp` que este proyecto no tiene (la raíz es `PlanificaMinaApp`). Si
      # se queda en el árbol, rompe cualquier `flutter test` posterior.
      - name: Generar andamio de Android si hace falta
        run: |
          if [ ! -d "android" ]; then
            echo "Carpeta android/ ausente: generándola."
            flutter create --platforms=android --project-name planificamina .
            rm -f test/widget_test.dart
          fi

      # El andamio se regenera en cada build, así que todo lo que se
      # personalice dentro de android/ se pierde. Estos dos ajustes se
      # reaplican aquí, después de generarlo, leyendo de android_res/.
      - name: Aplicar icono y nombre de la aplicación
        run: |
          set -e
          res="android/app/src/main/res"
          manifest="android/app/src/main/AndroidManifest.xml"
          test -d "$res" || { echo "No existe $res"; exit 1; }
          test -f "$manifest" || { echo "No existe $manifest"; exit 1; }

          # Icono: pisa el logotipo de Flutter del template.
          cp -r android_res/res/. "$res/"
          echo "Iconos copiados:"
          find "$res" -name 'ic_launcher*' | sort

          # Nombre visible bajo el icono. Sin esto queda "planificamina",
          # que es el nombre del paquete Dart, en minúsculas y sin espacio.
          sed -i 's/android:label="[^"]*"/android:label="PlanificaMina"/' "$manifest"
          grep -q 'android:label="PlanificaMina"' "$manifest" \
            || { echo "No se pudo fijar android:label"; exit 1; }
          echo "android:label fijado a PlanificaMina"

      # Un único APK universal, que funciona en cualquier teléfono Android.
      # No se compila por arquitectura a propósito: repartir cuatro archivos a
      # estudiantes obliga a cada uno a averiguar cuál le toca, y equivocarse
      # da un error de instalación difícil de interpretar. Pesa más, pero se
      # instala sin preguntas.
      - name: Compilar APK
        run: flutter build apk --release

      # apksigner y zipalign viven en build-tools, cuya versión cambia con la
      # imagen del runner. Se resuelve la más reciente instalada en vez de
      # fijar un número que caducaría.
      - name: Localizar herramientas de firma del Android SDK
        run: |
          set -e
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$sdk" || { echo "No hay ANDROID_HOME ni ANDROID_SDK_ROOT"; exit 1; }
          bt=$(ls -d "$sdk"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          test -n "$bt" || { echo "No hay build-tools en $sdk"; exit 1; }
          test -x "$bt/apksigner" || { echo "No existe $bt/apksigner"; exit 1; }
          test -x "$bt/zipalign" || { echo "No existe $bt/zipalign"; exit 1; }
          echo "APKSIGNER=$bt/apksigner" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$bt/zipalign" >> "$GITHUB_ENV"
          echo "build-tools: $bt"

      # Sin esto, el APK sale firmado con la clave de depuración: la misma en
      # todas las instalaciones de Android del mundo, pensada para desarrollo.
      # Play Protect la reconoce y avisa. Firmarlo con una clave propia y
      # estable no elimina el aviso de «origen desconocido» — eso lo produce
      # instalar fuera de Play Store, pase lo que pase — pero sí quita el
      # motivo que depende de nosotros, y es imprescindible para que las
      # actualizaciones se instalen encima de la versión anterior.
      #
      # La clave vive en los secrets del repositorio. Cómo generarla y
      # cargarla: docs/FIRMA_APK.md
      - name: Firmar el APK para distribución
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk" || { echo "No existe $apk"; exit 1; }

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=APK firmado con clave de depuración::Falta el secret KEYSTORE_BASE64, así que Play Protect avisará al instalar. Pasos en docs/FIRMA_APK.md"
            echo "Firma actual del APK:"
            "$APKSIGNER" verify --print-certs "$apk" 2>/dev/null \
              | grep -i 'certificate DN' || true
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/planificamina.jks
          if [ ! -s /tmp/planificamina.jks ]; then
            echo "El keystore decodificado está vacío: revisa que KEYSTORE_BASE64 se copiara entero."
            exit 1
          fi

          # zipalign antes de firmar: apksigner exige que el APK ya esté
          # alineado, porque firmar después de alinear invalidaría la firma.
          "$ZIPALIGN" -p -f 4 "$apk" /tmp/aligned.apk

          "$APKSIGNER" sign \
            --ks /tmp/planificamina.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$apk" \
            /tmp/aligned.apk

          rm -f /tmp/planificamina.jks /tmp/aligned.apk

          echo "Verificando la firma:"
          "$APKSIGNER" verify --verbose --print-certs "$apk"

          # Si siguiera saliendo la clave de depuración, algo falló en
          # silencio y no queremos publicar ese APK como si estuviera firmado.
          if "$APKSIGNER" verify --print-certs "$apk" | grep -qi 'CN=Android Debug'; then
            echo "El APK sigue firmado con la clave de depuración."
            exit 1
          fi
          echo "APK firmado para distribución."

      - name: Publicar como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: planificamina-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Adjuntar al release de la etiqueta
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            APK de PlanificaMina generado automáticamente desde ${{ github.ref_name }}.

            **Cómo instalarlo:** descarga `app-release.apk` y ábrelo en el
            teléfono. Android pedirá permiso para instalar desde orígenes
            desconocidos y Play Protect mostrará un aviso: es lo normal en
            cualquier aplicación que no venga de Google Play. Elige «Instalar
            de todos modos».

            Aplicación educativa. Modelo simplificado: no sustituye software
            profesional de planeamiento ni un estudio de factibilidad.
