name: planificamina
description: Simulador educativo de planeamiento minero para estudiantes de Ingeniería de Minas.
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: '>=3.6.0 <4.0.0'
  # Color.withValues() requiere Flutter 3.27 o superior.
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.2.3
  # Tercera dependencia, y la única añadida por una razón de producto: el SDK
  # de Flutter no sabe reproducir audio propio. SystemSound solo emite el clic
  # del sistema, que en la mayoría de teléfonos Android no se oye.
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # Efectos de interfaz sintetizados por tools/gen_sounds.ps1. Pesan 59 kB
    # en total y son WAV a propósito: sin decodificador de por medio, la
    # latencia entre el toque y el sonido es la mínima posible.
    - assets/sounds/
